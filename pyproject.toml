[project]
name = "geo-vlm"
version = "0.1.0"
description = "JEPA-to-GeoSPARQL research pipeline for SpaceNet road extraction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0.0",
  "pyyaml>=6.0.2",
  "rasterio>=1.4.0",
  "submitit>=1.5.2",
  "torch>=2.2.0",
  "torchgeo>=0.7.0",
  "torchvision>=0.17.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_vlm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
