[project]
name = "geo-vlm"
version = "0.1.0"
description = "JEPA-to-GeoSPARQL research pipeline for SpaceNet road extraction."
requires-python = ">=3.12"
dependencies = [
  "geopandas>=1.0.0",
  "pyyaml>=6.0.2",
  "rdflib>=7.0.0",
  "shapely>=2.0.0",
  "torch>=2.2.0",
  "torchgeo>=0.7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_vlm"]
